# Netlify configuration — My Kenyalang Homes
#
# Netlify auto-installs @netlify/plugin-nextjs for Next.js projects, which
# handles routing and any future server-rendered routes or API handlers. Every
# page is statically prerendered today, but keeping the standard runtime means
# adding an intake API later needs no deployment change.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Long-lived caching for the placeholder and, later, the real photography.
# These are content-addressed by filename, so replacing a photo means replacing
# the file — bump the name if a stale cache ever becomes a problem.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
